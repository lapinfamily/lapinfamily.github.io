<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kriah Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful dojo for a 6-year-old, big targets, calm parent controls
   IDEA: a dojo scroll and belt rack; each vowel group is a belt to earn
   PICTURE: the syllable on a paper scroll card, huge; belts drawn as knotted SVG belts
   COLOUR and TYPE: lacquer red, paper, ink; Frank Ruhl Libre for Hebrew, Fredoka for UI
   LAYOUT: one column, max 760px, everything tappable at 56px+ */
:root{color-scheme:light dark;
--bg:light-dark(#f6efe2,#17110f);--paper:light-dark(#fffaf0,#2a211d);--ink:light-dark(#1c1410,#f5ece0);
--soft:light-dark(#6b5a4c,#c9b8a6);--red:#b3261e;--red2:light-dark(#8f1d17,#d9473d);--line:light-dark(#e3d6c2,#46382f);
--ok:light-dark(#1f7a3a,#4fc072);--bad:light-dark(#b3261e,#ff6b5e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Fredoka,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--red2);outline-offset:3px}
.heb{font-family:"Frank Ruhl Libre","Noto Serif Hebrew","David","Times New Roman",serif;direction:rtl;unicode-bidi:isolate}
header{background:var(--red);color:#fff8ec;position:relative;overflow:hidden}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar .home{font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px;padding:6px 0}
.bar .sp{flex:1}
.stars{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;background:rgba(0,0,0,.18);padding:6px 12px;border-radius:999px}
.gear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.18);position:relative}
.hero{max-width:760px;margin:0 auto;padding:4px 16px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px}
.hero h1{margin:0;font-size:clamp(30px,6vw,46px);line-height:1.05;text-wrap:balance}
.hero p{margin:6px 0 0;opacity:.9;max-width:34ch}
.hero .big{font-size:clamp(64px,16vw,120px);line-height:.9;opacity:.95;font-weight:700}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.rack{display:grid;gap:12px}
.beltrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 16px;text-align:start;min-height:76px}
.beltrow.cur{border-color:var(--red2);box-shadow:0 4px 0 var(--red2)}
.beltrow[disabled]{opacity:.45;cursor:not-allowed}
.beltrow b{font-size:19px;display:block}.beltrow small{color:var(--soft);font-size:14px}
.belt{width:110px;height:40px;display:block}
.tag{font-size:14px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);white-space:nowrap}
.tag.done{background:var(--ok);color:#fff}
.segs{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;margin-top:6px}
.segs i{height:8px;border-radius:2px;background:var(--line)}.segs i.y{background:var(--ok)}.segs i.n{background:var(--bad)}
h2{font-size:clamp(26px,5vw,34px);line-height:1.1;margin:4px 0 8px}
.tip{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0 18px}
.tip p{margin:0 0 10px}
.ex{display:flex;flex-wrap:wrap;gap:10px;direction:rtl}
.ex button{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:6px 14px;min-width:72px;text-align:center}
.ex .h{font-size:44px;line-height:1.2;display:block}.ex .t{font-size:14px;color:var(--soft);direction:ltr;display:block}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{background:var(--red);color:#fff8ec;border-radius:18px;padding:18px;text-align:start;min-height:110px;box-shadow:0 5px 0 var(--red2)}
.mode b{font-size:21px;display:block}.mode span{font-size:15px;opacity:.92}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}
.mode[disabled]{opacity:.5}
.ghost{border:2px solid var(--line);border-radius:14px;padding:10px 16px;min-height:48px;background:var(--paper);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.y{background:var(--ok)}.dots i.n{background:var(--bad)}.dots i.c{background:var(--red2)}
.scroll{background:var(--paper);border-radius:22px;border:2px solid var(--line);box-shadow:0 10px 0 -2px var(--line);padding:18px;text-align:center;position:relative}
.scroll::before,.scroll::after{content:"";position:absolute;left:18px;right:18px;height:10px;border-radius:6px;background:var(--red)}
.scroll::before{top:-6px}.scroll::after{bottom:-6px}
.syl{font-size:clamp(110px,30vw,200px);line-height:1.15;font-weight:500;margin:6px 0}
.syl.word{font-size:clamp(70px,17vw,130px)}
.reveal{min-height:96px;display:grid;place-items:center}
.tr{font-size:clamp(34px,8vw,48px);font-weight:700;color:var(--red2);letter-spacing:.02em}
.tr small{display:block;font-size:16px;color:var(--soft);font-weight:500;letter-spacing:0}
.pic{font-size:64px;line-height:1}
.big{min-height:64px;border-radius:18px;padding:12px 22px;font-size:21px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.go{background:var(--red);color:#fff8ec;box-shadow:0 5px 0 var(--red2)}
.yes{background:var(--ok);color:#fff;flex:1}.no{background:var(--paper);border:2px solid var(--line);flex:1}
.ctr{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.ear{width:120px;height:120px;border-radius:50%;background:var(--red);color:#fff8ec;display:grid;place-items:center;margin:4px auto 16px;box-shadow:0 6px 0 var(--red2)}
.ear:active{transform:translateY(3px);box-shadow:0 3px 0 var(--red2)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{background:var(--paper);border:3px solid var(--line);border-radius:20px;min-height:130px;font-size:clamp(64px,16vw,96px);line-height:1.1}
.opt.w{font-size:clamp(34px,9vw,54px)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt.wrong{border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.chart{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;direction:rtl}
.chart.w{grid-template-columns:repeat(2,minmax(0,1fr))}
.cell{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:6px;text-align:center;transition:filter .3s}
.cell .h{font-size:clamp(54px,14vw,84px);line-height:1.2;display:block}
.chart.w .cell .h{font-size:clamp(34px,9vw,52px)}
.chart.hide .cell .h{filter:blur(14px)}
.cell.miss{border-color:var(--bad)}
.cell .mk{direction:ltr;font-size:14px;font-weight:600;border-radius:10px;padding:6px 10px;margin:4px auto 2px;display:block;border:2px solid var(--line);min-height:36px}
.cell.miss .mk{background:var(--bad);color:#fff;border-color:var(--bad)}
.timer{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.note{color:var(--soft);font-size:15px;text-align:center}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
select,input[type=range]{width:100%;font:inherit;font-size:16px;min-height:44px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.toggle input{width:24px;height:24px}
.burst{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center;z-index:9}
.burst div{font-size:72px;animation:pop .8s ease-out forwards;color:#f2c230;text-shadow:0 3px 0 #8f6a00}
@keyframes pop{from{transform:scale(.3);opacity:1}to{transform:scale(1.6) translateY(-60px);opacity:0}}
.ceremony{position:fixed;inset:0;background:rgba(20,10,8,.82);display:grid;place-items:center;z-index:10;padding:20px}
.ceremony .card{text-align:center;max-width:420px;animation:rise .6s ease-out}
.ceremony .belt{width:240px;height:88px;margin:0 auto}
@keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr)}.hero .big{font-size:72px}.beltrow{grid-template-columns:80px minmax(0,1fr)}.beltrow .tag{grid-column:2;justify-self:start}.belt{width:80px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="home" id="homeBtn" aria-label="Back to the dojo">Kriah Dojo</button>
    <span class="sp"></span>
    <span class="stars" aria-label="Stars"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f2c230" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.2 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg><span id="starN">0</span></span>
    <button class="gear" id="gear" aria-label="Grown-up settings"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
  </div>
  <div class="hero" id="hero">
    <div><h1>Earn your belts in reading</h1><p>Each belt is a group of nekudos. Get 18 of the last 20 right to earn it.</p></div>
    <div class="big heb" lang="he" aria-hidden="true">קְרִיאָה</div>
  </div>
</header>
<main id="app"></main>
<script>
{
const KEY='kriahDojo_v1';
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- letters (Sephardi vowels, Ashkenazi sav) ---------- */
// id, display, sound key, transliteration, Hebrew TTS spelling, English TTS spelling, guttural, dagesh partner
const L=[
['alef','א','','','א','',1],['bet','בּ','b','b','בּ','b',0,'vet'],['vet','ב','v','v','ו','v',0,'bet'],
['gimel','ג','g','g','ג','g'],['dalet','ד','d','d','ד','d'],['hei','ה','h','h','ה','h',1],['vav','ו','v','v','ו','v'],
['zayin','ז','z','z','ז','z'],['chet','ח','ch','ch','ח','kh',1],['tet','ט','t','t','ט','t'],['yud','י','y','y','י','y'],
['kaf','כּ','k','k','כּ','k',0,'chaf'],['chaf','כ','ch','ch','ח','kh',0,'kaf'],['lamed','ל','l','l','ל','l'],['mem','מ','m','m','מ','m'],
['nun','נ','n','n','נ','n'],['samech','ס','s','s','ס','s'],['ayin','ע','','','ע','',1],['pei','פּ','p','p','פּ','p',0,'fei'],
['fei','פ','f','f','פ','f',0,'pei'],['tzadi','צ','tz','tz','צ','ts'],['kuf','ק','k','k','ק','k'],['reish','ר','r','r','ר','r'],
['shin','שׁ','sh','sh','שׁ','sh',0,'sin'],['sin','שׂ','s','s','ס','s',0,'shin'],['tav','תּ','t','t','תּ','t',0,'sav'],['sav','ת','s','s','ס','s',0,'tav']
].map(a=>({id:a[0],ch:a[1],snd:a[2],tr:a[3],he:a[4],en:a[5],gut:!!a[6],pair:a[7]||null}));
const LI=Object.fromEntries(L.map(x=>[x.id,x]));

/* ---------- vowels ---------- */
const V=[
{id:'kamatz',m:'ָ',s:'a',n:'Kamatz'},{id:'patach',m:'ַ',s:'a',n:'Patach'},
{id:'chirik',m:'ִ',s:'i',n:'Chirik'},{id:'chirikY',m:'ִ',t:'י',s:'i',n:'Chirik + yud'},
{id:'segol',m:'ֶ',s:'e',n:'Segol'},{id:'tzeirei',m:'ֵ',s:'e',n:'Tzeirei'},{id:'tzeireiY',m:'ֵ',t:'י',s:'e',n:'Tzeirei + yud'},
{id:'cholam',m:'ֹ',s:'o',n:'Cholam'},{id:'cholamV',m:'',t:'וֹ',s:'o',n:'Cholam male'},
{id:'kubutz',m:'ֻ',s:'u',n:'Kubutz'},{id:'shuruk',m:'',t:'וּ',s:'u',n:'Shuruk'},
{id:'sheva',m:'ְ',s:'e',n:'Sheva',quick:1,noGut:1},
{id:'chatafP',m:'ֲ',s:'a',n:'Chataf patach',quick:1,gutOnly:1},{id:'chatafS',m:'ֱ',s:'e',n:'Chataf segol',quick:1,gutOnly:1},{id:'chatafK',m:'ֳ',s:'o',n:'Chataf kamatz',quick:1,gutOnly:1}
];
const VI=Object.fromEntries(V.map(x=>[x.id,x]));
const TRV={a:'ah',aw:'aw',i:'ee',e:'eh',o:'oh',u:'oo'};
const VO={a:'ah',aw:'aw',i:'e',e:'eh',o:'oh',u:'ooh'};
const HEV={aw:'וֹ',a:'ָה',i:'ִי',e:'ֶה',o:'וֹ',u:'וּ'};

/* ---------- words (Black belt) ---------- */
const W=[
['שָׁלוֹם','shA-lohm','shA lome','👋','hello, peace'],['כֶּלֶב','keh-lev','keh lev','🐕','dog'],['דָּג','dAg','dAg','🐟','fish'],
['יָד','yAd','yAd','✋','hand'],['סֵפֶר','seh-fer','seh fair','📖','book'],['בַּיִת','bah-yiS','bah yiS','🏠','house'],
['יֶלֶד','yeh-led','yeh led','👦','boy'],['אַבָּא','ah-bA','ah bA','👨','Abba'],['אִמָּא','ee-mA','ee mA','👩','Ima'],
['מַיִם','mah-yim','mah yeem','💧','water'],['לֶחֶם','leh-chem','leh khem','🍞','bread'],['שֶׁמֶשׁ','sheh-mesh','sheh mesh','☀️','sun'],
['סוּס','soos','soose','🐴','horse'],['עֵץ','etz','ets','🌳','tree'],['פֶּרַח','peh-rach','peh rahkh','🌸','flower'],
['חָלָב','chA-lAv','khA lAv','🥛','milk'],['גָּמָל','gA-mAl','gA mAl','🐫','camel'],['אֲרִי','ah-ree','ah ree','🦁','lion'],
['כּוֹכָב','koh-chAv','koh khAv','⭐','star'],['שַׁבָּת','shah-bAS','shah bAS','🍷','Shabbos'],['נֵר','nehr','nair','🕯️','candle'],
['תּוֹרָה','toh-rA','toe rA','📜','Torah'],['בְּרָכָה','b\'rA-chA','brA khA','🙏','bracha'],['סֻכָּה','soo-kA','soo kA','🛖','sukkah'],
['מְנוֹרָה','m\'noh-rA','mnoh rA','🕎','menorah'],['כִּסֵּא','kee-seh','kee seh','🪑','chair'],['עוּגָה','oo-gA','oo gA','🎂','cake'],
['דֻּבִּי','doo-bee','doo bee','🧸','teddy bear'],['רֶגֶל','reh-gel','reh gell','🦶','foot'],['אֹזֶן','oh-zen','oh zen','👂','ear'],
['פִּיל','peel','peel','🐘','elephant'],['דְּבוֹרָה','d\'voh-rA','dvoh rA','🐝','bee'],['גֶּשֶׁם','geh-shem','geh shem','🌧️','rain'],
['מוֹדֶה אֲנִי','moh-deh ah-nee','moh deh ah nee','🌅','Modeh Ani'],['שְׁמַע יִשְׂרָאֵל','sh\'mah yis-rA-el','shmah yiss rA ell','✨','Shema Yisrael'],['בָּרוּךְ אַתָּה','bA-rooch ah-tA','bA rookh ah tA','🙌','Baruch Atah']
];
function sav(w){const a=[...w];let o='';for(let i=0;i<a.length;i++){let c=a[i];if(c==='ת'){let j=i+1,d=false;while(j<a.length&&/[֑-ׇ]/.test(a[j])){if(a[j]==='ּ')d=true;j++}if(!d)c='ס'}o+=c}return o}
const WORDS=[];
const KAW=()=>P.set.kam==='aw',SAV=()=>P.set.sav!==false;
const tok=s=>s.replace(/A/g,KAW()?'aw':'ah').replace(/S/g,SAV()?'s':'t');
function buildWords(){WORDS.length=0;W.forEach((w,i)=>WORDS.push({key:'w:'+i,word:1,disp:w[0],tr:tok(w[1]),en:tok(w[2]),pic:w[3],mean:w[4],he:SAV()?sav(w[0]):w[0],snd:'w'+i,isNew:true}))}

/* ---------- belts ---------- */
const BELTS=[
{id:'white',name:'White belt',c:'#f4f1ea',nv:['kamatz','patach'],tip:()=>KAW()?'Kamatz (a little T) says "aw". Patach (a line) says "ah".':'Kamatz (a little T) and patach (a line) both say "ah".'},
{id:'yellow',name:'Yellow belt',c:'#f2c230',nv:['chirik','chirikY'],tip:'Chirik is one dot under the letter and says "ee". A yud after it stays quiet.'},
{id:'orange',name:'Orange belt',c:'#ee7d22',nv:['segol','tzeirei','tzeireiY'],tip:'Segol (three dots) and tzeirei (two dots side by side) say "eh". A yud after tzeirei stays quiet.'},
{id:'green',name:'Green belt',c:'#3a9a4b',nv:['cholam','cholamV'],tip:'Cholam is a dot up top and says "oh". A vav with a dot on its head also says "oh".'},
{id:'blue',name:'Blue belt',c:'#2d6cdf',nv:['kubutz','shuruk'],tip:'Kubutz (three slanted dots) and shuruk (a vav with a dot in its belly) say "oo".'},
{id:'purple',name:'Purple belt',c:'#7b4bc4',nv:['sheva','chatafP','chatafS','chatafK'],tip:'Sheva (two dots stacked) at the start is a quick "eh". The chataf vowels are quick vowels that live under א ה ח ע.'},
{id:'brown',name:'Brown belt',c:'#7a4a26',pairs:true,tip:()=>'Dot or no dot? בּ b, ב v. כּ k, כ ch. פּ p, פ f. תּ t, ת '+(SAV()?'s':'t (same sound)')+'. Shin dot on the right says sh, on the left says s.'},
{id:'black',name:'Black belt',c:'#151515',words:true,tip:'Real words and siddur words. Read the whole word, then check.'}
];
const ALLV=BELTS.flatMap(b=>b.nv||[]);
function ok(l,v){if(v.gutOnly&&!l.gut)return false;if(v.noGut&&l.gut)return false;if(l.id==='vav'&&v.id==='cholam')return false;return true}
function syl(l,v,isNew){
  let s=v.s;if(v.id==='kamatz'&&KAW())s='aw';
  const soft=l.id==='sav'&&!SAV(),ls=soft?'t':l.snd,lt=soft?'t':l.tr,lh=soft?'ת':l.he,le=soft?'t':l.en;
  const key=s==='aw'&&mode()==='he'?'o':s;
  return {key:'s:'+l.id+':'+v.id,L:l.id,V:v.id,disp:l.ch+v.m+(v.t||''),snd:ls+'|'+key,isNew,
    tr:v.id==='sheva'?(lt?lt+"'":"'"):(lt+TRV[s]),note:v.quick?'quick sound':'',
    he:lh+HEV[s],vo:!le,en:!le?VO[s]:v.id==='sheva'?(le+'uh'):(le+TRV[s])};
}
let POOLS={};
function rebuild(){POOLS={};recent=[];buildWords()}
function pool(i){
  if(POOLS[i])return POOLS[i];
  const b=BELTS[i];let p=[];
  if(b.words)p=WORDS;
  else if(b.pairs){L.filter(l=>l.pair).forEach(l=>ALLV.forEach(id=>{const v=VI[id];if(ok(l,v))p.push(syl(l,v,true))}))}
  else{const prev=BELTS.slice(0,i).flatMap(x=>x.nv||[]);
    [...b.nv.map(id=>[id,true]),...prev.map(id=>[id,false])].forEach(([id,n])=>{const v=VI[id];L.forEach(l=>{if(ok(l,v))p.push(syl(l,v,n))})})}
  return POOLS[i]=p;
}

/* ---------- storage ---------- */
function fresh(){return {v:1,stars:0,belts:{},items:{},set:{mode:'auto',voice:'',rate:.75,unlockAll:false}}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1)return Object.assign(fresh(),d)}catch(e){}return fresh()}
let P=load();
if(!P.set.kam)P.set.kam='ah';if(P.set.sav===undefined)P.set.sav=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
function BS(id){return P.belts[id]||(P.belts[id]={hist:[],earned:false,best:null})}
const unlocked=i=>i===0||P.set.unlockAll||BS(BELTS[i-1].id).earned;
function curBelt(){let c=0;BELTS.forEach((b,i)=>{if(unlocked(i))c=i});return c}

/* ---------- speech ---------- */
const hasTTS='speechSynthesis' in window;
let voices=[];
function lv(){if(hasTTS)voices=speechSynthesis.getVoices()||[]}
lv();if(hasTTS)speechSynthesis.onvoiceschanged=()=>{lv();rebuild();if(view==='settings')settings()};
const heV=()=>voices.filter(v=>/^(he|iw)/i.test(v.lang));
const enV=()=>voices.filter(v=>/^en/i.test(v.lang));
function mode(){if(!hasTTS)return 'none';if(P.set.mode!=='auto')return P.set.mode;return heV().length?'he':'en'}
function voiceFor(m){const list=m==='he'?heV():enV();return list.find(v=>v.voiceURI===P.set.voice)||list.find(v=>/en-US/.test(v.lang))||list[0]||null}
function say(it){
  let m=mode();if(m==='none')return false;
  if(it.vo&&m==='he'&&enV().length)m='en';
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m==='he'?it.he:it.en);const v=voiceFor(m);if(v)u.voice=v;u.lang=v?v.lang:(m==='he'?'he-IL':'en-US');u.rate=P.set.rate;speechSynthesis.speak(u);return true}catch(e){return false}
}
let ac;
function tone(f,d,ty,t0,g){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),n=ac.createGain(),t=ac.currentTime+(t0||0);o.type=ty||'sine';o.frequency.value=f;n.gain.setValueAtTime(g||.12,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const ding=()=>{tone(880,.15);tone(1320,.25,'sine',.1)};
const bonk=()=>tone(170,.25,'triangle',0,.15);
function burst(){const d=document.createElement('div');d.className='burst';d.innerHTML='<div>★</div>';document.body.appendChild(d);setTimeout(()=>d.remove(),850)}

/* ---------- picking ---------- */
let recent=[];
function pick(p){
  let tot=0;const ws=p.map(it=>{if(recent.includes(it.key))return 0;const st=P.items[it.key]||{a:0,m:0};let w=(it.isNew?2:1)*(1+3*st.m/(st.a+1));if(!st.a)w*=1.5;tot+=w;return w});
  let r=Math.random()*tot,it=p[p.length-1];
  if(tot===0)it=p[Math.floor(Math.random()*p.length)];else for(let i=0;i<p.length;i++){r-=ws[i];if(r<=0){it=p[i];break}}
  recent.push(it.key);if(recent.length>Math.min(4,p.length-1))recent.shift();return it;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function options(it,p){
  const out=[it],seen=new Set([it.snd]),take=(list,max)=>{let n=0;for(const x of shuffle(list)){if(out.length>=4||n>=max)return;if(!seen.has(x.snd)){out.push(x);seen.add(x.snd);n++}}};
  if(!it.word){const l=LI[it.L];if(l.pair)take(p.filter(x=>x.L===l.pair&&x.V===it.V),1);take(p.filter(x=>x.L===it.L),2)}
  take(p,4);return shuffle(out);
}

/* ---------- recording results ---------- */
let G=null;
function record(it,good){
  const st=P.items[it.key]||(P.items[it.key]={a:0,m:0});st.a++;st.m=good?st.m*.7:st.m+1;
  if(good)P.stars++;
  const b=BELTS[G.bi],bs=BS(b.id);
  if(it.isNew){bs.hist.push(good?1:0);if(bs.hist.length>20)bs.hist.shift();
    if(!bs.earned&&bs.hist.length>=20&&bs.hist.reduce((a,c)=>a+c,0)>=18){bs.earned=true;G.newBelt=true}}
  save();$('#starN').textContent=P.stars;
}

/* ---------- views ---------- */
let view='home';
function beltSvg(c,earned){return `<svg class="belt" viewBox="0 0 120 44" aria-hidden="true"><rect x="2" y="12" width="116" height="13" rx="3" fill="${c}" stroke="rgba(0,0,0,.35)"/><path d="M53 23 43 42h8l7-15zM67 23l10 19h-8l-7-15z" fill="${c}" stroke="rgba(0,0,0,.35)"/>${earned?'<rect x="90" y="12" width="10" height="13" fill="#d4af37"/>':''}<rect x="50" y="7" width="20" height="23" rx="5" fill="${c}" stroke="rgba(0,0,0,.45)"/></svg>`}
function segs(id){const h=BS(id).hist;let s='';for(let i=0;i<20;i++)s+=`<i class="${i<h.length?(h[i]?'y':'n'):''}"></i>`;return `<div class="segs" aria-label="${h.filter(Boolean).length} of last ${h.length} right">${s}</div>`}
function hero(show){$('#hero').style.display=show?'':'none'}
function home(){
  view='home';hero(true);if(hasTTS)speechSynthesis.cancel();
  const c=curBelt();
  app.innerHTML=`<div class="rack">${BELTS.map((b,i)=>{const bs=BS(b.id),u=unlocked(i);
    return `<button class="beltrow ${i===c?'cur':''}" data-b="${i}" ${u?'':'disabled'}>${beltSvg(b.c,bs.earned)}<span><b>${b.name}</b><small>${b.words?'Words':b.pairs?'Dot or no dot':b.nv.map(id=>VI[id].n).join(', ')}</small>${u?segs(b.id):''}</span><span class="tag ${bs.earned?'done':''}">${bs.earned?'Earned':u?'Train':'Locked'}</span></button>`}).join('')}</div>`;
  app.querySelectorAll('.beltrow').forEach(x=>x.onclick=()=>beltView(+x.dataset.b));
}
function examples(i){
  const b=BELTS[i];
  if(b.words)return WORDS.slice(0,3);
  if(b.pairs)return ['bet','vet','kaf','chaf','shin','sin'].map(id=>syl(LI[id],VI.kamatz,true));
  return b.nv.map(id=>syl(LI[VI[id].gutOnly?'alef':'bet'],VI[id],true));
}
function beltView(i){
  view='belt';hero(false);const b=BELTS[i],bs=BS(b.id),ex=examples(i),noAudio=mode()==='none';
  app.innerHTML=`<div class="row" style="gap:14px">${beltSvg(b.c,bs.earned)}<h2>${b.name}</h2></div>
  <div class="tip"><p>${esc(typeof b.tip==='function'?b.tip():b.tip)}</p><div class="ex">${ex.map((x,k)=>`<button data-k="${k}" aria-label="Hear ${esc(x.tr)}"><span class="h heb" lang="he">${x.disp}</span><span class="t">${esc(x.tr)}</span></button>`).join('')}</div></div>
  <div class="modes">
   <button class="mode" data-m="read"><b>Read and check</b><span>Read it out loud, then hear it and check yourself.</span></button>
   <button class="mode" data-m="listen" ${noAudio?'disabled':''}><b>Listen and tap</b><span>${noAudio?'Needs a voice on this device.':'Hear a sound, tap the one that matches.'}</span></button>
   <button class="mode" data-m="chart"><b>Speed row</b><span>Read a whole row as fast as you can.${bs.best?` Best: ${bs.best.toFixed(1)}s`:''}</span></button>
  </div>
  <p style="margin:18px 0 4px;font-weight:600">Belt progress: last 20 tries</p>${segs(b.id)}
  <div class="row" style="margin-top:18px"><button class="ghost" id="back">Back to the dojo</button></div>`;
  app.querySelectorAll('.ex button').forEach(x=>x.onclick=()=>say(ex[+x.dataset.k]));
  app.querySelectorAll('.mode').forEach(x=>x.onclick=()=>start(i,x.dataset.m));
  $('#back').onclick=home;
}
function start(bi,m){G={bi,m,p:pool(bi),n:0,good:0,res:[],newBelt:false};recent=[];view='play';hero(false);m==='chart'?chart():next()}
const ROUND=10;
function dots(){let s='';for(let i=0;i<ROUND;i++)s+=`<i class="${i<G.res.length?(G.res[i]?'y':'n'):i===G.res.length?'c':''}"></i>`;return `<div class="dots">${s}</div>`}
function next(){if(G.res.length>=ROUND)return summary();G.m==='read'?qRead():qListen()}
const EAR='<svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
function qRead(){
  const it=pick(G.p);
  app.innerHTML=`${dots()}<div class="scroll"><div class="syl heb ${it.word?'word':''}" lang="he">${it.disp}</div><div class="reveal" id="rv"><span class="note">Say it out loud first.</span></div></div>
  <div class="ctr" id="ct"><button class="big go" id="chk">${EAR.replace(/56/g,'30')} Check</button></div>`;
  $('#chk').onclick=()=>{
    say(it);
    $('#rv').innerHTML=`<div>${it.pic?`<div class="pic">${it.pic}</div>`:''}<div class="tr">${esc(it.tr)}${it.note||it.mean?`<small>${esc(it.mean||it.note)}</small>`:''}</div></div>`;
    $('#ct').innerHTML=`<button class="big yes" id="y">I got it</button><button class="big no" id="n">Not yet</button><button class="ghost" id="again" style="width:100%">Hear it again</button>`;
    $('#again').onclick=()=>say(it);
    $('#y').onclick=()=>{record(it,true);G.res.push(1);ding();burst();setTimeout(next,700)};
    $('#n').onclick=()=>{record(it,false);G.res.push(0);say(it);$('#ct').innerHTML='<p class="note">Listen once more and say it with the voice.</p>';setTimeout(next,2200)};
  };
}
function qListen(){
  const it=pick(G.p),opts=options(it,G.p);let missed=false,done=false;
  app.innerHTML=`${dots()}<button class="ear" id="ear" aria-label="Hear the sound">${EAR}</button>
  <div class="opts">${opts.map((o,k)=>`<button class="opt heb ${o.word?'w':''}" lang="he" data-k="${k}">${o.disp}</button>`).join('')}</div>`;
  $('#ear').onclick=()=>say(it);setTimeout(()=>say(it),250);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done)return;const o=opts[+b.dataset.k];
    if(o.key===it.key){done=true;b.classList.add('right');if(!missed){record(it,true);G.res.push(1);burst()}ding();setTimeout(next,900)}
    else{if(!missed){missed=true;record(it,false);G.res.push(0)}b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');bonk();setTimeout(()=>say(it),450)}
  });
}
function makeRow(){
  const p=G.p;if(BELTS[G.bi].words)return shuffle(p).slice(0,4);
  const a=pick(p.filter(x=>x.isNew));
  let row=Math.random()<.5?p.filter(x=>x.L===a.L):p.filter(x=>x.V===a.V);
  row=shuffle(row);const seen=new Set(),out=[];for(const x of row){if(!seen.has(x.disp)){seen.add(x.disp);out.push(x)}if(out.length===6)break}
  if(out.length<4)for(const x of shuffle(p)){if(out.length>=6)break;if(!seen.has(x.disp)){seen.add(x.disp);out.push(x)}}
  return out;
}
function chart(){
  const row=makeRow(),miss=new Set(),w=!!row[0].word;let t0=0,tm=null,secs=0;
  const grid=cls=>`<div class="chart ${w?'w':''} ${cls}" id="grid">${row.map((x,k)=>`<div class="cell" data-k="${k}"><span class="h heb" lang="he">${x.disp}</span></div>`).join('')}</div>`;
  app.innerHTML=`<h2 style="text-align:center">Speed row</h2><div class="timer" id="tm">0.0</div>${grid('hide')}<div class="ctr" id="ct"><button class="big go" id="go">Start</button></div><p class="note" id="hint">Read every one out loud, right to left. Tap Done when you finish.</p>`;
  $('#go').onclick=()=>{
    $('#grid').classList.remove('hide');t0=performance.now();
    tm=setInterval(()=>{secs=(performance.now()-t0)/1000;$('#tm').textContent=secs.toFixed(1)},100);
    $('#ct').innerHTML='<button class="big go" id="dn">Done</button>';
    $('#dn').onclick=()=>{clearInterval(tm);secs=(performance.now()-t0)/1000;$('#tm').textContent=secs.toFixed(1)+'s';checkPhase()};
  };
  function checkPhase(){
    app.querySelectorAll('.cell').forEach(c=>{const k=+c.dataset.k;c.insertAdjacentHTML('beforeend',`<span class="t note" style="direction:ltr;display:block">${esc(row[k].tr)}</span><button class="mk">Missed it</button>`);
      c.querySelector('.h').onclick=()=>say(row[k]);c.querySelector('.h').style.cursor='pointer';
      c.querySelector('.mk').onclick=()=>{miss.has(k)?miss.delete(k):miss.add(k);c.classList.toggle('miss',miss.has(k))}});
    $('#hint').textContent='Tap each one to hear it. Mark any you missed, then tap Finish.';
    $('#ct').innerHTML='<button class="big go" id="fin">Finish</button>';
    $('#fin').onclick=()=>{
      row.forEach((x,k)=>record(x,!miss.has(k)));const bs=BS(BELTS[G.bi].id);let rec=false;
      if(!miss.size&&(!bs.best||secs<bs.best)){bs.best=secs;rec=true;save()}
      if(!miss.size){ding();burst()}
      const msg=miss.size?`${row.length-miss.size} of ${row.length} right. Try the missed ones again.`:rec?`New best time: ${secs.toFixed(1)} seconds!`:`All right in ${secs.toFixed(1)} seconds. Best is ${bs.best.toFixed(1)}.`;
      $('#ct').innerHTML=`<p style="width:100%;text-align:center;font-weight:600;font-size:20px;margin:0">${msg}</p><button class="big go" id="more">Another row</button><button class="ghost" id="bk">Choose a game</button>`;
      $('#more').onclick=()=>{if(G.newBelt)ceremony(()=>{G.newBelt=false;chart()});else chart()};$('#bk').onclick=()=>{if(G.newBelt)ceremony(()=>beltView(G.bi));else beltView(G.bi)};
    };
  }
}
function summary(){
  const b=BELTS[G.bi],g=G.res.filter(Boolean).length;
  app.innerHTML=`<div class="scroll" style="padding:28px 18px"><h2>Round done!</h2><p style="font-size:24px;font-weight:700;margin:6px 0">${g} of ${ROUND} right</p><p class="note">${b.name} progress</p>${segs(b.id)}</div>
  <div class="ctr"><button class="big go" id="again">Play again</button><button class="ghost" id="bk">Choose a game</button><button class="ghost" id="hm">Dojo</button></div>`;
  $('#again').onclick=()=>start(G.bi,G.m);$('#bk').onclick=()=>beltView(G.bi);$('#hm').onclick=home;
  if(G.newBelt){G.newBelt=false;ceremony(()=>{})}
}
function ceremony(after){
  const b=BELTS[G.bi],nx=BELTS[G.bi+1];
  tone(523,.2);tone(659,.2,'sine',.18);tone(784,.2,'sine',.36);tone(1047,.5,'sine',.54);
  const d=document.createElement('div');d.className='ceremony';
  d.innerHTML=`<div class="card"><p style="margin:0;font-weight:600;color:var(--soft)">You earned the</p>${beltSvg(b.c,true)}<h2>${b.name}!</h2><p>${nx?`The ${nx.name} is open now.`:'You finished the whole dojo. Real sefarim are next!'}</p><button class="big go" id="cx">Yay!</button></div>`;
  document.body.appendChild(d);d.querySelector('#cx').focus();d.querySelector('#cx').onclick=()=>{d.remove();after()};
}
function settings(){
  view='settings';hero(false);const m=mode(),list=m==='he'?heV():enV(),cv=voiceFor(m);
  app.innerHTML=`<h2>Grown-up settings</h2>
  <div class="card"><b>Voice</b>
   <p class="note" style="text-align:start">${!hasTTS?'This browser has no speech voices. Read and check still works with the sound-out spelling.':heV().length?'A Hebrew voice was found on this device.':'No Hebrew voice found, so the English sound-out voice is used. On iPad or iPhone, add one under Settings, Accessibility, Spoken Content, Voices, Hebrew, then reload.'}</p>
   <label for="md">Voice type</label><select id="md"><option value="auto">Automatic</option><option value="he">Hebrew voice</option><option value="en">English sound-out voice</option></select>
   <label for="vc">Which voice</label><select id="vc">${list.length?list.map(v=>`<option value="${esc(v.voiceURI)}" ${cv&&cv.voiceURI===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option>None available</option>'}</select>
   <label for="rt">Speed: <span id="rv">${P.set.rate.toFixed(2)}</span></label><input type="range" id="rt" min="0.4" max="1.1" step="0.05" value="${P.set.rate}">
   <div class="row" style="margin-top:12px"><button class="ghost" id="t1">Test בָּ</button><button class="ghost" id="t2">Test ת</button><button class="ghost" id="t3">Test שַׁבָּת</button></div></div>
  <div class="card"><b>Pronunciation</b>
   <label for="kp">Kamatz (as in <span class="heb" lang="he">בָּ</span>)</label><select id="kp"><option value="ah">"ah" (Sephardi / Israeli)</option><option value="aw">"aw" (Ashkenazi)</option></select>
   <label for="sp">Tav without a dot ת</label><select id="sp"><option value="s">"s" (Ashkenazi sav)</option><option value="t">"t" (Israeli tav)</option></select>
   <p class="note" style="text-align:start;margin-top:10px">Hebrew device voices speak Israeli Hebrew. With "aw" kamatz, a Hebrew voice says syllables like בָּ as "bo", and whole words keep their Israeli kamatz. The written sound-out and the English sound-out voice say "aw".</p></div>
  <div class="card"><b>Belts</b><label class="toggle"><input type="checkbox" id="ua" ${P.set.unlockAll?'checked':''}> Unlock every belt</label>
   <div class="row" style="margin-top:10px"><button class="ghost" id="rs">Reset all progress</button></div></div>
  <button class="ghost" id="bk">Back to the dojo</button>`;
  $('#md').value=P.set.mode;
  $('#md').onchange=e=>{P.set.mode=e.target.value;P.set.voice='';save();rebuild();settings()};
  $('#kp').value=P.set.kam;$('#sp').value=SAV()?'s':'t';
  $('#kp').onchange=e=>{P.set.kam=e.target.value;save();rebuild()};
  $('#sp').onchange=e=>{P.set.sav=e.target.value==='s';save();rebuild()};
  $('#vc').onchange=e=>{P.set.voice=e.target.value;save()};
  $('#rt').oninput=e=>{P.set.rate=+e.target.value;$('#rv').textContent=P.set.rate.toFixed(2);save()};
  $('#t1').onclick=()=>say(syl(LI.bet,VI.kamatz));$('#t2').onclick=()=>say(syl(LI.sav,VI.kamatz));$('#t3').onclick=()=>say(WORDS[19]);
  $('#ua').onchange=e=>{P.set.unlockAll=e.target.checked;save()};
  let arm=false;$('#rs').onclick=e=>{if(!arm){arm=true;e.target.textContent='Tap again to erase everything';return}const s=P.set;P=fresh();P.set=s;save();$('#starN').textContent=0;home()};
  $('#bk').onclick=home;
}

/* ---------- header ---------- */
$('#homeBtn').onclick=home;
$('#gear').onclick=()=>{
  const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);
  const d=document.createElement('div');d.className='ceremony';
  d.innerHTML=`<form class="card" id="gate" style="min-width:280px"><h2>Grown-ups only</h2><label for="ga">What is ${a} × ${b}?</label><input id="ga" type="number" inputmode="numeric" autocomplete="off" style="width:100%;font:inherit;font-size:24px;min-height:52px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center"><p class="note" id="gm" style="min-height:24px"></p><div class="row" style="justify-content:center"><button class="big go" type="submit">Open settings</button><button class="ghost" type="button" id="gc">Cancel</button></div></form>`;
  document.body.appendChild(d);const inp=d.querySelector('#ga');inp.focus();
  d.querySelector('#gc').onclick=()=>d.remove();
  d.querySelector('#gate').onsubmit=e=>{e.preventDefault();if(+inp.value===a*b){d.remove();settings()}else{d.querySelector('#gm').textContent='Not quite. Try again.';inp.value='';inp.focus()}};
};
$('#starN').textContent=P.stars;
rebuild();home();
}
</script>
</body>
</html>
